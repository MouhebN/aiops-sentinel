# Lab-only SNMPv2c. Community "banklab" is not a secret.
# Sentinel: UDP 161, SNMP_BASIC / SNMP_ROUTER_METRICS.
# @SYSNAME@ is replaced by start-snmpd.sh.

sysLocation  Bank Lab
sysContact   pfe-lab
sysName      @SYSNAME@
sysDescr     @SYSNAME@ Containerlab node (Alpine net-snmp)

# Listen on every interface, including banklab-mgmt (172.30.30.x).
agentAddress udp:0.0.0.0:161

# Read-only SNMPv2c. net-snmp treats a community with no SOURCE as localhost-only
# (local snmpget works, remote queries are dropped with no reply).
rocommunity banklab 127.0.0.1
rocommunity banklab 172.30.30.0/24

dontLogTCPWrappersConnects true
