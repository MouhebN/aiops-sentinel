# MediaMTX for camera-01. ffmpeg publisher is started by start-camera.sh
# only after TCP :8554 is listening (not via runOnInit).

logLevel: warn

rtsp: yes
rtspAddress: :8554
rtpAddress: :8000
rtcpAddress: :8001

hls: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no
playback: no

# TCP is what Sentinel RTSP_HEALTH uses (OPTIONS then close).
rtspTransports: [tcp, udp]

paths:
  # Demo URL: rtsp://172.30.30.40:8554/live
  # Sentinel RTSP_HEALTH sends OPTIONS rtsp://<ip>:<tcpPort>/stream
  # Unknown paths still return an RTSP status line, which is enough for that check.
  live:
    source: publisher
