spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aiops_sentinel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aiops}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aiops123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Existing Postgres was created by Hibernate. Baseline at 0 so V1 actually runs.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:aiops-sentinel-supervision-platform-jwt-secret-key-2026}
app.security.jwt.expiration-seconds=${APP_SECURITY_JWT_EXPIRATION_SECONDS:28800}
app.audit.trusted-proxy-enabled=${APP_AUDIT_TRUSTED_PROXY_ENABLED:false}
app.syslog.enabled=${APP_SYSLOG_ENABLED:true}
app.syslog.udp-port=${APP_SYSLOG_UDP_PORT:5514}
# RFC 3164 timestamps (e.g. "Aug 18 16:16:00") have no year or timezone.
# Interpret them in this IANA zone, then store UTC Instants. JSON uses ISO-8601 with Z.
# Convert to the operator's local timezone only in the frontend.
app.syslog.default-timezone=${APP_SYSLOG_DEFAULT_TIMEZONE:Africa/Tunis}
app.netflow.enabled=${NETFLOW_ENABLED:true}
app.netflow.nfdump-command=${NETFLOW_NFDUMP_COMMAND:nfdump}
app.netflow.data-dir=${NETFLOW_DATA_DIR:./runtime/netflow}
app.netflow.collector-port=${NETFLOW_COLLECTOR_PORT:2055}
app.netflow.high-volume-threshold-bytes=${APP_NETFLOW_HIGH_VOLUME_THRESHOLD_BYTES:104857600}
app.netflow.auto-import-enabled=${NETFLOW_AUTO_IMPORT_ENABLED:true}
app.netflow.import-interval-ms=${NETFLOW_IMPORT_INTERVAL_MS:15000}
app.incident.correlation-inactivity-minutes=${INCIDENT_CORRELATION_INACTIVITY_MINUTES:30}
app.ai-service.base-url=${APP_AI_SERVICE_BASE_URL:http://localhost:8001}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:25MB}
app.pcap.capture.default-duration-seconds=20
app.pcap.capture.max-duration-seconds=60
app.pcap.capture.min-duration-seconds=5
app.pcap.capture.max-file-size-bytes=20971520
app.pcap.capture.max-concurrent=1
app.pcap.capture.default-point=bank-firewall-wan
app.pcap.capture.async=${APP_PCAP_CAPTURE_ASYNC:true}
app.pcap.lab-sensor.base-url=${APP_PCAP_LAB_SENSOR_URL:http://172.30.30.10:8090}
app.pcap.lab-sensor.connect-timeout-ms=2000
app.pcap.lab-sensor.read-timeout-ms=8000
app.pcap.lab-sensor.file-read-timeout-ms=15000
app.pcap.points.bank-firewall-wan.provider=LAB_SENSOR
app.pcap.points.bank-firewall-wan.display-name=BANK-FW-01 / WAN
app.pcap.points.bank-firewall-wan.interface-name=eth1
app.pcap.auto.enabled=true
app.pcap.auto.duration-seconds=20
app.pcap.auto.categories=SECURITY
app.pcap.auto.signal-tokens=PORT_SCAN,SUSPICIOUS,RECON
app.pcap.auto.min-severity=WARNING
app.pcap.rolling.enabled=true
app.pcap.rolling.pre-trigger-seconds=60
app.pcap.rolling.post-trigger-seconds=20
app.pcap.rolling.segment-seconds=5
app.pcap.rolling.max-file-size-mb=20
